    # rhel_repos:
    #   - "rhel-10-for-x86_64-baseos-rpms"
    #   - "rhel-10-for-x86_64-appstream-rpms"

    # # Container / layout
    # pulp_rpm_sync_policy: additive
    # pulp_image: "docker.io/pulp/pulp:stable"
    # pulp_container_name: pulp
    # pulp_publish_port: 8080
    # pulp_https: false
    # pulp_data_root: /var/lib/pulp-stack
    # # Public names clients use (Django ALLOWED_HOSTS + default CONTENT_ORIGIN host).
    # #pulp_public_hostname: rhel-pulp.lab.rippa.io
    # pulp_public_ip: "10.10.4.101"
    # # Extra Host headers to allow (strings). localhost/127.0.0.1 are always added for local checks.
    # pulp_extra_allowed_hosts: []
    # # If set, full URL for CONTENT_ORIGIN. When empty: http(s)://pulp_public_hostname:port
    # pulp_content_origin: ""
    # # Open pulp_publish_port/tcp in firewalld when true (RHEL default firewall).
    # # If set, playbook attempts a non-interactive admin password reset inside the container (use Ansible Vault).
    # pulp_admin_password: ""
    # # Pulp UI (beta) is built into current pulp/pulp OCI images; served at /ui/ . Set false to disable.
    # pulp_enable_ui: true
    # # Must match pulp-oci-images nginx template (template_nginx.py); override if your image differs.
    # pulp_static_root: "/var/lib/operator/static"

    # # Pulp RPM: RHEL BaseOS + AppStream remotes/repos (Red Hat CDN). Requires host RHSM entitlement files.
    # pulp_configure_rhel_cdn_repos: true
    # pulp_sync_rhel_cdn_repos: true
    # pulp_admin_username: admin
    # # If empty, falls back to pulp_admin_password for API auth (set one of them for repo tasks).
    # #pulp_api_password: ""
    # # Override if your Ansible controller must use a different URL to reach Pulp than pulp_public_hostname:port.
    # pulp_api_public_base_url: ""
    # pulp_api_validate_certs: true
    # pulp_rpm_remote_policy: on_demand
    # pulp_rpm_sync_timeout: 86400
    # pulp_rhsm_ca_cert_path: /etc/rhsm/ca/redhat-uep.pem
    # # # Container / layout
    # # pulp_image: "docker.io/pulp/pulp:stable"
    # # pulp_container_name: pulp
    # # pulp_publish_port: 8080
    # # pulp_https: false
    # # pulp_data_root: /var/lib/pulp-stack
    # # # If set, must be a full URL pulp clients use (e.g. https://pulp.example.com). When empty, derived from FQDN + port.
    # # pulp_content_origin: ""
    # # # If set, playbook attempts a non-interactive admin password reset inside the container (use Ansible Vault).
    # # pulp_admin_password: ""

  pre_tasks:
    # - name: Ensure required RHSM tooling is present
    #   ansible.builtin.dnf:
    #     name:
    #       - subscription-manager
    #       - dnf-plugins-core
    #     state: present

    # - name: Register system using activation key and org
    #   community.general.redhat_subscription:
    #     state: present
    #     activationkey: "{{ rhsm_activation_key }}"
    #     org_id: "{{ rhsm_org_id }}"
    #     release: "{{ rhsm_release }}"
    #     auto_attach: "{{ rhsm_auto_attach }}"
    #   when:
    #     - rhsm_activation_key | length > 0
    #     - rhsm_org_id | length > 0

    # - name: Register system using RHSM username/password
    #   community.general.redhat_subscription:
    #     state: present
    #     username: "{{ rhsm_username }}"
    #     password: "{{ rhsm_password }}"
    #     release: "{{ rhsm_release }}"
    #     auto_attach: "{{ rhsm_auto_attach }}"
    #   when:
    #     - rhsm_activation_key | length == 0
    #     - rhsm_org_id | length == 0
    #     - rhsm_username | length > 0
    #     - rhsm_password | length > 0

    # - name: Fail when no RHSM credentials or activation key are provided
    #   ansible.builtin.fail:
    #     msg: >-
    #       Provide either rhsm_activation_key + rhsm_org_id, or
    #       rhsm_username + rhsm_password.
    #   when:
    #     - rhsm_activation_key | length == 0
    #     - rhsm_org_id | length == 0
    #     - (rhsm_username | length == 0 or rhsm_password | length == 0)

    # - name: Enable required Red Hat CDN repositories
    #   community.general.rhsm_repository:
    #     name: "{{ item }}"
    #     state: enabled
    #   loop: "{{ rhel_repos }}"

    - name: Refresh package metadata
      ansible.builtin.command: dnf makecache
      changed_when: false


  tasks:
    - name: Set Facts
      ansible.builtin.set_fact:
        pulp_public_hostname:: "{{ ansible_facts['ansible_fqdn'] }}"
        pulp_public_ip: "{{ ansible_facts['ansible_default_ipv4']['address'] }}"
    - name: Install Podman
      ansible.builtin.dnf:
        name: podman
        state: present

    - name: Set Podman volume label suffix when SELinux is enforcing
      ansible.builtin.set_fact:
        pulp_volume_z: "{{ ':Z' if (ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled') else '' }}"

    - name: Ensure Pulp state directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ pulp_data_root }}/settings"
        - "{{ pulp_data_root }}/pulp_storage"
        - "{{ pulp_data_root }}/pgsql"
        - "{{ pulp_data_root }}/containers"
        - "{{ pulp_data_root }}/container_build"

    - name: Build Django ALLOWED_HOSTS list
      ansible.builtin.set_fact:
        pulp_merged_allowed_hosts: >-
          {{
            (
              [pulp_public_hostname, pulp_public_ip, ansible_fqdn, 'localhost', '127.0.0.1']
              + (pulp_extra_allowed_hosts | default([]))
            ) | reject('equalto', '') | unique | list
          }}

    - name: Compute CONTENT_ORIGIN URL
      ansible.builtin.set_fact:
        pulp_effective_content_origin: >-
          {{
            pulp_content_origin
            if (pulp_content_origin | default('') | length > 0)
            else (
              ('https' if pulp_https else 'http')
              ~ '://' ~ pulp_public_hostname ~ ':' ~ (pulp_publish_port | string)
            )
          }}

    - name: Compute Pulp API base URL for Ansible (controller reaches this URL)
      ansible.builtin.set_fact:
        pulp_api_base_url: >-
          {{
            pulp_api_public_base_url
            if (pulp_api_public_base_url | default('') | length > 0)
            else (
              ('https' if pulp_https else 'http')
              ~ '://' ~ pulp_public_hostname ~ ':' ~ (pulp_publish_port | string)
            )
          }}

    - name: Derive RHEL CDN path components for Pulp
      ansible.builtin.set_fact:
        pulp_rhel_major: "{{ rhsm_release.split('.')[0] }}"
        pulp_rhel_dist: "rhel{{ rhsm_release.split('.')[0] }}"
        pulp_rhel_cdn_release: "{{ rhsm_release }}"
        pulp_rhel_arch: "{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}"
      when: pulp_configure_rhel_cdn_repos | bool

    - name: Define RHEL CDN repo/remotes for Pulp (BaseOS + AppStream)
      ansible.builtin.set_fact:
        pulp_rhel_cdn_repositories:
          - repo: "rhel-{{ pulp_rhel_major }}-baseos"
            remote: "rhsm-cdn-rhel-{{ pulp_rhel_major }}-baseos"
            url: "https://cdn.redhat.com/content/dist/{{ pulp_rhel_dist }}/{{ pulp_rhel_cdn_release }}/{{ pulp_rhel_arch }}/baseos/os/"
          - repo: "rhel-{{ pulp_rhel_major }}-appstream"
            remote: "rhsm-cdn-rhel-{{ pulp_rhel_major }}-appstream"
            url: "https://cdn.redhat.com/content/dist/{{ pulp_rhel_dist }}/{{ pulp_rhel_cdn_release }}/{{ pulp_rhel_arch }}/appstream/os/"
      when: pulp_configure_rhel_cdn_repos | bool

    - name: Build CSRF_TRUSTED_ORIGINS (hostname + IP + optional override)
      ansible.builtin.set_fact:
        pulp_csrf_trusted_origins: >-
          {{
            (
              [
                ('https' if pulp_https else 'http') ~ '://' ~ pulp_public_hostname ~ ':' ~ (pulp_publish_port | string),
                ('https' if pulp_https else 'http') ~ '://' ~ pulp_public_ip ~ ':' ~ (pulp_publish_port | string),
              ]
              + ([pulp_content_origin] if (pulp_content_origin | default('') | length > 0) else [])
            ) | unique | list
          }}

    - name: Write Pulpcore settings (CONTENT_ORIGIN + ALLOWED_HOSTS + CSRF for UI login)
      ansible.builtin.copy:
        dest: "{{ pulp_data_root }}/settings/settings.py"
        mode: "0644"
        content: |
          CONTENT_ORIGIN = "{{ pulp_effective_content_origin }}"
          ALLOWED_HOSTS = {{ pulp_merged_allowed_hosts | to_json }}
          CSRF_TRUSTED_ORIGINS = {{ pulp_csrf_trusted_origins | to_json }}

    - name: Write Pulp UI config (same-origin API relative to browser URL)
      ansible.builtin.copy:
        dest: "{{ pulp_data_root }}/settings/pulp-ui-config.json"
        mode: "0644"
        content: |
          {
            "API_BASE_PATH": "/pulp/api/v3/",
            "UI_BASE_PATH": "/ui/"
          }
      when: pulp_enable_ui | bool

    - name: Build Podman volume list for Pulp container
      ansible.builtin.set_fact:
        pulp_podman_volumes_final: >-
          {{
            [
              pulp_data_root ~ '/settings:/etc/pulp' ~ pulp_volume_z,
              pulp_data_root ~ '/pulp_storage:/var/lib/pulp' ~ pulp_volume_z,
              pulp_data_root ~ '/pgsql:/var/lib/pgsql' ~ pulp_volume_z,
              pulp_data_root ~ '/containers:/var/lib/containers' ~ pulp_volume_z,
              pulp_data_root ~ '/container_build:/var/lib/pulp/.local/share/containers' ~ pulp_volume_z,
            ]
            + (
                [
                  pulp_data_root ~ '/settings/pulp-ui-config.json:' ~ pulp_static_root ~ '/pulp_ui/pulp-ui-config.json' ~ pulp_volume_z,
                ]
              if pulp_enable_ui | bool else []
              )
          }}

    - name: Check whether firewalld is running
      ansible.builtin.command: systemctl is-active firewalld
      register: pulp_firewalld_is_active
      changed_when: false
      failed_when: false
      when: pulp_manage_firewall | bool

    # Uses ansible.posix (not community.general). Add ansible.posix to your EE / controller.
    - name: Allow Pulp port through firewalld
      ansible.posix.firewalld:
        port: "{{ pulp_publish_port }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      when:
        - pulp_manage_firewall | bool
        - pulp_firewalld_is_active.rc == 0
        - pulp_firewalld_is_active.stdout | trim == 'active'

    - name: Run Pulp container
      containers.podman.podman_container:
        name: "{{ pulp_container_name }}"
        image: "{{ pulp_image }}"
        state: started
        restart_policy: always
        pull: newer
        publish:
          - "0.0.0.0:{{ pulp_publish_port }}:{{ '443' if pulp_https else '80' }}"
        env:
          PULP_HTTPS: "{{ 'true' if pulp_https else 'false' }}"
          PULP_UI: "{{ 'true' if pulp_enable_ui | bool else 'false' }}"
          PULP_STATIC_ROOT: "{{ pulp_static_root }}/"
        volumes: "{{ pulp_podman_volumes_final }}"
        device:
          - /dev/fuse

    - name: Wait for Pulp API (via public hostname Host header)
      ansible.builtin.uri:
        url: "{{ 'https' if pulp_https else 'http' }}://127.0.0.1:{{ pulp_publish_port }}/pulp/api/v3/status/"
        headers:
          Host: "{{ pulp_public_hostname }}"
        validate_certs: false
        status_code: 200
      register: pulp_api_check
      until: pulp_api_check.status == 200
      retries: 36
      delay: 5

    - name: Verify Pulp API reachable by IP
      ansible.builtin.uri:
        url: "{{ 'https' if pulp_https else 'http' }}://{{ pulp_public_ip }}:{{ pulp_publish_port }}/pulp/api/v3/status/"
        validate_certs: false
        status_code: 200

    - name: Verify Pulp UI is served
      ansible.builtin.uri:
        url: "{{ 'https' if pulp_https else 'http' }}://127.0.0.1:{{ pulp_publish_port }}/ui/"
        headers:
          Host: "{{ pulp_public_hostname }}"
        validate_certs: false
        status_code: [200, 302, 304]
      when: pulp_enable_ui | bool

    - name: Verify Pulp UI config is served on the same vhost
      ansible.builtin.uri:
        url: "{{ 'https' if pulp_https else 'http' }}://127.0.0.1:{{ pulp_publish_port }}/pulp-ui-config.json"
        headers:
          Host: "{{ pulp_public_hostname }}"
        validate_certs: false
        status_code: 200
      when: pulp_enable_ui | bool

    - name: Apply admin password when variable is set
      ansible.builtin.shell: |
        set -euo pipefail
        printf '%s\n%s\n' "${PULP_PW}" "${PULP_PW}" | podman exec -i "{{ pulp_container_name }}" pulpcore-manager reset-admin-password
      environment:
        PULP_PW: "{{ pulp_admin_password }}"
      when: pulp_admin_password | length > 0
      no_log: true

    - name: Configure Pulp RPM remotes and repositories (RHEL BaseOS + AppStream via RH CDN)
      when:
        - pulp_configure_rhel_cdn_repos | bool
        - (pulp_api_password | default('') | length > 0) or (pulp_admin_password | default('') | length > 0)
      block:
        - name: Choose password used to authenticate to Pulp API
          ansible.builtin.set_fact:
            pulp_squeezer_password: "{{ pulp_api_password if pulp_api_password | length > 0 else pulp_admin_password }}"
          no_log: true

        - name: Locate RHSM entitlement key PEM for CDN client authentication
          ansible.builtin.shell: ls -1 /etc/pki/entitlement/*-key.pem 2>/dev/null | head -1 || true
          register: pulp_rh_entitlement_key_file
          changed_when: false
          failed_when: false

        - name: Fail when no RHSM entitlement PEMs exist for CDN sync
          ansible.builtin.fail:
            msg: >-
              Subscribe this host with RHSM (see pre_tasks) so /etc/pki/entitlement/*-key.pem exists,
              or set pulp_configure_rhel_cdn_repos: false and create remotes manually.
          when: pulp_rh_entitlement_key_file.stdout | default('') | length == 0

        - name: Derive entitlement certificate path from key filename
          ansible.builtin.set_fact:
            pulp_rh_entitlement_cert_file: "{{ pulp_rh_entitlement_key_file.stdout | regex_replace('-key\\.pem$', '.pem') }}"

        - name: Slurp Red Hat CA for CDN TLS
          ansible.builtin.slurp:
            src: "{{ pulp_rhsm_ca_cert_path }}"
          register: pulp_slurp_rh_ca

        - name: Slurp RHSM entitlement private key
          ansible.builtin.slurp:
            src: "{{ pulp_rh_entitlement_key_file.stdout }}"
          register: pulp_slurp_rh_key
          no_log: true

        - name: Slurp RHSM entitlement certificate
          ansible.builtin.slurp:
            src: "{{ pulp_rh_entitlement_cert_file }}"
          register: pulp_slurp_rh_cert
          no_log: true

        - name: Expose PEM strings for Pulp RPM remotes
          ansible.builtin.set_fact:
            pulp_rh_ca_pem: "{{ pulp_slurp_rh_ca.content | b64decode }}"
            pulp_rh_client_key_pem: "{{ pulp_slurp_rh_key.content | b64decode }}"
            pulp_rh_client_cert_pem: "{{ pulp_slurp_rh_cert.content | b64decode }}"
          no_log: true

        # --- Pulp RPM API via uri (no pulp_glue) ---
        - name: Initialize RPM remote href map
          ansible.builtin.set_fact:
            pulp_remote_hrefs_merged: {}

        - name: Query existing RPM remotes by name
          ansible.builtin.uri:
            url: "{{ pulp_api_base_url }}/pulp/api/v3/remotes/rpm/rpm/?name={{ item.remote | urlencode }}"
            method: GET
            url_username: "{{ pulp_admin_username }}"
            url_password: "{{ pulp_squeezer_password }}"
            force_basic_auth: true
            validate_certs: "{{ pulp_api_validate_certs }}"
            return_content: true
            status_code: [200]
          loop: "{{ pulp_rhel_cdn_repositories }}"
          register: pulp_remote_query
          delegate_to: localhost
          no_log: true

        - name: Record existing RPM remote pulp_hrefs
          ansible.builtin.set_fact:
            pulp_remote_hrefs_merged: "{{ pulp_remote_hrefs_merged | combine({ merge.item.remote: merge.json.results[0].pulp_href }) }}"
          loop: "{{ pulp_remote_query.results }}"
          loop_control:
            loop_var: merge
          when: merge.json.count | default(0) | int > 0

        - name: Create RPM remote when missing
          ansible.builtin.uri:
            url: "{{ pulp_api_base_url }}/pulp/api/v3/remotes/rpm/rpm/"
            method: POST
            url_username: "{{ pulp_admin_username }}"
            url_password: "{{ pulp_squeezer_password }}"
            force_basic_auth: true
            validate_certs: "{{ pulp_api_validate_certs }}"
            body_format: json
            body:
              name: "{{ item.remote }}"
              url: "{{ item.url }}"
              tls_validation: true
              ca_cert: "{{ pulp_rh_ca_pem }}"
              client_cert: "{{ pulp_rh_client_cert_pem }}"
              client_key: "{{ pulp_rh_client_key_pem }}"
              policy: "{{ pulp_rpm_remote_policy }}"
            status_code: [201]
          loop: "{{ pulp_rhel_cdn_repositories }}"
          when: item.remote not in pulp_remote_hrefs_merged
          register: pulp_remote_create
          delegate_to: localhost
          no_log: true

        - name: Update existing RPM remote (CDN URL and entitlement PEMs)
          ansible.builtin.uri:
            url: "{{ pulp_api_base_url }}{{ pulp_remote_hrefs_merged[item.remote] }}"
            method: PATCH
            url_username: "{{ pulp_admin_username }}"
            url_password: "{{ pulp_squeezer_password }}"
            force_basic_auth: true
            validate_certs: "{{ pulp_api_validate_certs }}"
            body_format: json
            body:
              url: "{{ item.url }}"
              tls_validation: true
              ca_cert: "{{ pulp_rh_ca_pem }}"
              client_cert: "{{ pulp_rh_client_cert_pem }}"
              client_key: "{{ pulp_rh_client_key_pem }}"
              policy: "{{ pulp_rpm_remote_policy }}"
            status_code: [200, 202]
          loop: "{{ pulp_rhel_cdn_repositories }}"
          when: item.remote in pulp_remote_hrefs_merged
          delegate_to: localhost
          no_log: true

        - name: Refresh RPM remote query after creates
          ansible.builtin.uri:
            url: "{{ pulp_api_base_url }}/pulp/api/v3/remotes/rpm/rpm/?name={{ item.remote | urlencode }}"
            method: GET
            url_username: "{{ pulp_admin_username }}"
            url_password: "{{ pulp_squeezer_password }}"
            force_basic_auth: true
            validate_certs: "{{ pulp_api_validate_certs }}"
            return_content: true
            status_code: [200]
          loop: "{{ pulp_rhel_cdn_repositories }}"
          register: pulp_remote_query_final
          delegate_to: localhost
          no_log: true

        - name: Build final RPM remote pulp_href map
          ansible.builtin.set_fact:
            pulp_remote_hrefs_final: "{{ pulp_remote_hrefs_final | default({}) | combine({ z.item.remote: z.json.results[0].pulp_href }) }}"
          loop: "{{ pulp_remote_query_final.results }}"
          loop_control:
            loop_var: z
          when: z.json.count | default(0) | int > 0

        - name: Ensure RPM remote href map is complete
          ansible.builtin.assert:
            that:
              - pulp_remote_hrefs_final[check.remote] is defined
            fail_msg: "Missing pulp_href for remote {{ check.remote }} after create/query."
          loop: "{{ pulp_rhel_cdn_repositories }}"
          loop_control:
            loop_var: check

        - name: Initialize RPM repository href map
          ansible.builtin.set_fact:
            pulp_repo_hrefs_merged: {}

        - name: Query existing RPM repositories by name
          ansible.builtin.uri:
            url: "{{ pulp_api_base_url }}/pulp/api/v3/repositories/rpm/rpm/?name={{ item.repo | urlencode }}"
            method: GET
            url_username: "{{ pulp_admin_username }}"
            url_password: "{{ pulp_squeezer_password }}"
            force_basic_auth: true
            validate_certs: "{{ pulp_api_validate_certs }}"
            return_content: true
            status_code: [200]
          loop: "{{ pulp_rhel_cdn_repositories }}"
          register: pulp_repo_query
          delegate_to: localhost
          no_log: true

        - name: Record existing RPM repository pulp_hrefs
          ansible.builtin.set_fact:
            pulp_repo_hrefs_merged: "{{ pulp_repo_hrefs_merged | combine({ rp.item.repo: rp.json.results[0].pulp_href }) }}"
          loop: "{{ pulp_repo_query.results }}"
          loop_control:
            loop_var: rp
          when: rp.json.count | default(0) | int > 0

        - name: Create RPM repository when missing
          ansible.builtin.uri:
            url: "{{ pulp_api_base_url }}/pulp/api/v3/repositories/rpm/rpm/"
            method: POST
            url_username: "{{ pulp_admin_username }}"
            url_password: "{{ pulp_squeezer_password }}"
            force_basic_auth: true
            validate_certs: "{{ pulp_api_validate_certs }}"
            body_format: json
            body:
              name: "{{ item.repo }}"
              remote: "{{ pulp_remote_hrefs_final[item.remote] }}"
            status_code: [201]
          loop: "{{ pulp_rhel_cdn_repositories }}"
          when: item.repo not in pulp_repo_hrefs_merged
          delegate_to: localhost
          no_log: true

        - name: Point existing RPM repository at remote
          ansible.builtin.uri:
            url: "{{ pulp_api_base_url }}{{ pulp_repo_hrefs_merged[item.repo] }}"
            method: PATCH
            url_username: "{{ pulp_admin_username }}"
            url_password: "{{ pulp_squeezer_password }}"
            force_basic_auth: true
            validate_certs: "{{ pulp_api_validate_certs }}"
            body_format: json
            body:
              remote: "{{ pulp_remote_hrefs_final[item.remote] }}"
            status_code: [200, 202]
          loop: "{{ pulp_rhel_cdn_repositories }}"
          when: item.repo in pulp_repo_hrefs_merged
          delegate_to: localhost
          no_log: true

        - name: Refresh RPM repository hrefs after create or update
          ansible.builtin.uri:
            url: "{{ pulp_api_base_url }}/pulp/api/v3/repositories/rpm/rpm/?name={{ item.repo | urlencode }}"
            method: GET
            url_username: "{{ pulp_admin_username }}"
            url_password: "{{ pulp_squeezer_password }}"
            force_basic_auth: true
            validate_certs: "{{ pulp_api_validate_certs }}"
            return_content: true
            status_code: [200]
          loop: "{{ pulp_rhel_cdn_repositories }}"
          register: pulp_repo_query_final
          delegate_to: localhost
          no_log: true

        - name: Build final RPM repository pulp_href map
          ansible.builtin.set_fact:
            pulp_repo_hrefs_final: "{{ pulp_repo_hrefs_final | default({}) | combine({ rq.item.repo: rq.json.results[0].pulp_href }) }}"
          loop: "{{ pulp_repo_query_final.results }}"
          loop_control:
            loop_var: rq
          when: rq.json.count | default(0) | int > 0

        - name: Ensure RPM repository href map is complete
          ansible.builtin.assert:
            that:
              - pulp_repo_hrefs_final[chk.repo] is defined
            fail_msg: "Missing pulp_href for repository {{ chk.repo }}."
          loop: "{{ pulp_rhel_cdn_repositories }}"
          loop_control:
            loop_var: chk

        - name: Sync RPM repositories from Red Hat CDN (optional, long-running)
          when: pulp_sync_rhel_cdn_repos | bool
          block:
            - name: Queue RPM repository sync against Red Hat CDN
              ansible.builtin.uri:
                url: "{{ pulp_api_base_url }}{{ pulp_repo_hrefs_final[item.repo] }}sync/"
                method: POST
                url_username: "{{ pulp_admin_username }}"
                url_password: "{{ pulp_squeezer_password }}"
                force_basic_auth: true
                validate_certs: "{{ pulp_api_validate_certs }}"
                body_format: json
                body:
                  remote: "{{ pulp_remote_hrefs_final[item.remote] }}"
                  optimize: true
                  sync_policy: "{{ pulp_rpm_sync_policy }}"
                status_code: [202]
                return_content: true
              loop: "{{ pulp_rhel_cdn_repositories }}"
              register: pulp_sync_post
              delegate_to: localhost
              no_log: true

            - name: Poll Pulp until each sync task completes
              ansible.builtin.uri:
                url: "{{ pulp_api_base_url }}{{ sync_item.json.task }}"
                method: GET
                url_username: "{{ pulp_admin_username }}"
                url_password: "{{ pulp_squeezer_password }}"
                force_basic_auth: true
                validate_certs: "{{ pulp_api_validate_certs }}"
                return_content: true
                status_code: [200]
              register: pulp_sync_poll
              until: pulp_sync_poll.json.state in ['completed', 'failed', 'canceled']
              retries: "{{ [(pulp_rpm_sync_timeout | int / 10) | int, 30] | max }}"
              delay: 10
              failed_when: pulp_sync_poll.json.state | default('') in ['failed', 'canceled']
              loop: "{{ pulp_sync_post.results }}"
              loop_control:
                loop_var: sync_item
              delegate_to: localhost
              no_log: true
              when:
                - sync_item.get('skipped', false) == false
                - sync_item.json.task is defined
