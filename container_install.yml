---
# Deploy Pulp 3 using the official OCI image (Podman) on RHEL, with RHSM/CDN registration.
# Docs: https://pulpproject.org/pulp-oci-images/docs/admin/tutorials/quickstart/
#
# Collections (controller):
#   ansible-galaxy collection install community.general containers.podman
#
# Syncing Red Hat content into Pulp is configured inside Pulp (remotes/repos), not via these OS repos.

- name: Run Pulp in a Podman container on RHEL with Red Hat CDN registration
  hosts: "{{ pulp_host }}"
  become: true
  gather_facts: true

#  vars:
    # #pulp_public_hostname: rhel10-pulp.lab.rippa.io
    # #pulp_public_ip: "10.10.4.101"
    # pulp_extra_allowed_hosts: []
    # # If set, full URL for CONTENT_ORIGIN. When empty: http(s)://pulp_public_hostname:port
    # pulp_content_origin: ""
    # # Open pulp_publish_port/tcp in firewalld when true (RHEL default firewall).
    # pulp_manage_firewall: true
    # # RHSM — activation key + org (recommended) or username/password
    # # rhsm_activation_key: ""
    # # rhsm_org_id: ""
    # # rhsm_username: ""
    # # rhsm_password: ""
